name: Build and release InnoPhil APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Recreate the fixed debug signing key
        run: |
          echo "" | base64 -d > ci-debug.keystore

      - name: Build debug APK (versioned v${{ github.run_number }})
        run: >
          gradle assembleDebug
          -PappVersionCode=${{ github.run_number }}
          -PappVersionName=v${{ github.run_number }}

      - name: Rename APK for the release
        run: cp app/build/outputs/apk/debug/app-debug.apk InnoPhil-v${{ github.run_number }}.apk

      - name: Upload APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: InnoPhil-debug-apk
          path: InnoPhil-v${{ github.run_number }}.apk

      - name: Publish GitHub Release with the APK attached
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ github.run_number }}
          name: InnoPhil v${{ github.run_number }}
          artifacts: InnoPhil-v${{ github.run_number }}.apk
          body: "Automatic build from commit ${{ github.sha }}"
          allowUpdates: true
