plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.innophil.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.innophil.app"
        minSdk 26
        targetSdk 34
        // Static for now to get a first working build installed.
        // We'll wire automatic CI version-stamping back in once the app
        // is confirmed working on the phone.
        versionCode 1
        versionName "v1"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // CameraX - silent still capture without a visible preview/shutter UI
    def camerax_version = "1.3.4"
    implementation "androidx.camera:camera-core:$camerax_version"
    implementation "androidx.camera:camera-camera2:$camerax_version"
    implementation "androidx.camera:camera-lifecycle:$camerax_version"

    // WorkManager - reliable "retry until it sends" upload queue
    implementation "androidx.work:work-runtime-ktx:2.9.1"

    // Networking (swap in your real backend SDK here later - Firebase, Retrofit, etc.)
    implementation "com.squareup.okhttp3:okhttp:4.12.0"

    // Coroutines
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"
}
